name: Build & Push to Harbor

# Pushes the hardened multi-stage image (Dockerfile.k3s) to a private Harbor
# registry you control. Runs on tag pushes (v*) and manual dispatch.
#
# Required GitHub repository variables / secrets (Settings → Secrets and variables):
#   HARBOR_REGISTRY        e.g. harbor.example.com        (Actions variable)
#   HARBOR_PROJECT         e.g. plane                    (Actions variable)
#   HARBOR_IMAGE_NAME      default plane-mcp-server     (Actions variable)
#   HARBOR_USERNAME        robot account login          (Actions secret)
#   HARBOR_PASSWORD        robot account token          (Actions secret)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.3.2 or dev-main)"
        required: true
        default: "dev-main"
        type: string

env:
  REGISTRY: ${{ vars.HARBOR_REGISTRY }}
  PROJECT:  ${{ vars.HARBOR_PROJECT }}
  IMAGE:    ${{ vars.HARBOR_IMAGE_NAME || 'plane-mcp-server' }}
  # On tag pushes, use the tag verbatim (strip leading 'v'). Otherwise use the
  # workflow_dispatch input, falling back to dev-<sha>.
  TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}

jobs:
  build-and-push:
    name: Build & Push to Harbor
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          raw="${TAG}"
          # Strip leading 'v' for SemVer tags, keep others (dev-main, sha) as-is
          stripped=$(echo "$raw" | sed -E 's/^v([0-9].*)/\1/')
          echo "resolved=${stripped:-${raw}}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${stripped:-${raw}}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: env.REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Compute cache scope
        id: scope
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "scope=remote" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch — separate cache scope to avoid leaking layers between devs
            echo "scope=local" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.k3s
          platforms: linux/amd64,linux/arm64
          push: true
          load: false
          # Use the Harbor registry as the build cache backend instead of GitHub
          # Actions Cache (`type=gha`). The GHA cache backend intermittently
          # returns a 400 HTML error page from Azure, which fails the build at
          # the "exporting to GitHub Actions Cache" step.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE }}:buildcache-${{ steps.scope.outputs.scope }}
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE }}:buildcache-${{ steps.scope.outputs.scope }},mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE }}:${{ steps.tag.outputs.resolved }}
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=plane-mcp-server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.resolved }}

      - name: Verify push
        env:
          REGISTRY: ${{ env.REGISTRY }}
          PROJECT:  ${{ env.PROJECT }}
          IMAGE:    ${{ env.IMAGE }}
          TAG:      ${{ steps.tag.outputs.resolved }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          # HEAD the manifest to confirm Harbor accepted it.
          url="https://${REGISTRY}/v2/${PROJECT}/${IMAGE}/manifests/${TAG}"
          echo "Verifying ${url}"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "$url")
          if [[ "$status" != "200" ]]; then
            echo "Manifest HEAD failed with HTTP $status" >&2
            exit 1
          fi
          echo "OK — manifest is reachable."